[package]
name = "ekidongomidi-desktop"
version = "0.1.1"
description = "EkidongoMIDI desktop app (Tauri shell with native MIDI delivery)"
license = "GPL-3.0-or-later"
edition = "2021"
publish = false

[lib]
name = "ekidongomidi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midir = "0.10"
tauri-plugin-dialog = "2"
sentry = "0.49"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
