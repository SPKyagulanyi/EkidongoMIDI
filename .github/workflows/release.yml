name: Release (Windows installer)

# Builds the Windows installer on a version tag (v0.1.0, v0.2.0-beta.1, ...) or by hand.
# Tagged builds are attached to a GitHub release (marked pre-release while in beta).
# Error reporting is compiled in only when the SENTRY_DSN_DESKTOP repository secret is set.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build installer
        env:
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN_DESKTOP }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_DESKTOP }}
        run: pnpm --filter @ekidongo/desktop tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: EkidongoMIDI-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Attach to a GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" apps/desktop/src-tauri/target/release/bundle/nsis/*.exe \
            --title "EkidongoMIDI ${{ github.ref_name }}" --generate-notes --prerelease
